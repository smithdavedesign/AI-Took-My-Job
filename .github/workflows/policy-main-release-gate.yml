name: Main Release Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

jobs:
  enforce-main-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require human release label for integration promotions
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" != "main" ]]; then
            echo "Not a PR to main; skipping."
            exit 0
          fi

          if [[ "$HEAD_REF" != "integration/agent" ]]; then
            echo "Not an integration promotion PR; skipping main release gate."
            echo "Head branch: $HEAD_REF"
            exit 0
          fi

          if [[ "$LABELS" != *"human-reviewed-release"* ]]; then
            echo "Main release policy violation: missing required label human-reviewed-release."
            exit 1
          fi

          echo "Main release policy passed."
